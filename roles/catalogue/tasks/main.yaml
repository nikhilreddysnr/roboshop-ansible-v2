- name: AppSetup for {{ component }}
  include_role:
    name: common
    tasks_from: app-setup

- name: Nodejs for {{ component }}
  include_role:
    name: common
    tasks_from: nodejs

- name: Service Setup for {{ component }}
  include_role:
    name: common
    tasks_from: systemd-setup


- name: copy mongo repo
  copy:
    src: mongo.repo
    dest: /etc/yum.repos.d/mongo.repo

- name: install mongodb client
  dnf:
    name: mongodb-mongosh
    state: present

- name: check products loaded or not
  command: mongosh --host "{{ mongodb_host }}" --quiet --eval 'db.getSiblingDB("catalogue").products.countDocuments()'
  register: product_count

- name: print product_count
  debug:
    msg: "{{ product_count }}"

- name: load the products
  shell: mongosh --host "{{ mongodb_host }}" < /app/db/master-data.js
  when: product_count.stdout | int == 0

- name: restart for {{ component }}
  include_role:
    name: common
    tasks_from: restart