- name: "Copy Mongo repo"
  copy:
    src: mongo.repo
    dest: /etc/yum.repos.d/mongo.repo

- name: "Install Mongodb"
  package:
    name: mongodb-org
    state: present
  
- name: "Start and enable service"
  service:
    name: mongod
    state: started
    enabled: yes

- name: "Replace 127.0.0.1 to 0.0.0.0 in mongod.conf"
  replace:
    path: /etc/mongod.conf
    regexp: '127.0.0.1'
    replace: '0.0.0.0'

- name: "Restart Mongod"
  service:
    name: mongod
    state: restarted