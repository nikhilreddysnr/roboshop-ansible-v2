- name: Copy RabbitMqRepo
  copy: 
    src: rabbitmq.repo
    dest: /etc/yum.repos.d/rabbitmq.repo

- name: Install RabbitMQ
  dnf: 
    name:
    - erlang
    - rabbitmq-server
    state: present

- name: Satrt and enable service
  service:
    name: rabbitmq-server
    state: started
    enabled: yes

- name: Create a RabbitMQ user
  community.rabbitmq.rabbitmq_user:
    user: "{{ rabbitmq_user }}"
    password: "{{ rabbitmq_password }}"
    vhost: /
    configure_priv: .*
    read_priv: .*
    write_priv: .*
    state: present