- name: Create a user
  user:
    name: roboshop
    system: true
    create_home: false
    home: /app
    comment: roboshop system user
    shell: /sbin/nologin
    state : present

- name: remove directory if exists
  file:
    path: /app
    state: absent

- name: remove {{ component }}.zip
  file:
    path: /tmp/{{ component }}.zip
    state: absent

- name: Create a directory
  file:
    path: /app
    state: directory



- name: Downloading {{ component }} Application
  get_url:
    url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/{{ component }}-v4.zip
    dest: /tmp/{{ component }}.zip

- name: Unarchive {{ component }}.zip
  unarchive:
    src: /tmp/{{ component }}.zip
    dest: /app
    remote_src: yes