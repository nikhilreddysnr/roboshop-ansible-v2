- name: "Enable redis 7"
  command: dnf module enable redis:7 -y

- name: "Install redis 7"
  package: 
    name: redis
    state: present

- name: "Replace 127.0.0.1 to 0.0.0.0 in redis.conf"
  replace:
    path: /etc/redis/redis.conf
    regexp: '127.0.0.1'
    replace: '0.0.0.0'
  
- name: disable protected mode
  lineinfile:
    path: /etc/redis/redis.conf
    regexp: '^#?protected-mode yes'
    line: 'protected-mode no'

- name: enable and start redis
  service:
    name: redis
    state: restarted
    enabled: yes